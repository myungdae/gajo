<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <script>
      (() => {
        const region = location.pathname.split('/').filter(Boolean)[0];
        const supported = ['gajo','okcheon','muan','gyeryong','hapcheon','daejeon-junggu'];
        const host = location.hostname.toLowerCase();
        const hostRegions = {'gajo.odex.kr':'gajo','okcheon.odex.kr':'okcheon','muan.odex.kr':'muan','gyeryong.odex.kr':'gyeryong','hapcheon.odex.kr':'hapcheon','daejeon-junggu.odex.kr':'daejeon-junggu'};
        const platformPaths = ['/regions','/partner/apply','/partner/console','/region/apply','/partners/apply','/regional-report'];
        const path = location.pathname.length > 1 ? location.pathname.replace(/\/+$/, '') : location.pathname;
        const isPublicPartner = /^\/(?:go|visit)\/[^/]+$/.test(path);
        const isPlatform = platformPaths.includes(path) || /^\/partners\/[^/]+\/manage$/.test(path) || (path === '/' && (host === 'exkovia.com' || host === 'www.exkovia.com' || ((host === 'localhost' || host === '127.0.0.1' || host === '127.0.0.2' || host === '::1') && new URLSearchParams(location.search).get('platform') === 'exkovia')));
        const active = supported.includes(region) ? region : hostRegions[host] || ((host === 'localhost' || host === '127.0.0.1' || host === '127.0.0.2' || host === '::1') ? 'gajo' : undefined);
        if (!active || isPlatform || isPublicPartner) return;
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = `/manifest-${active}.webmanifest`;
        document.head.appendChild(link);
      })();
    </script>
    <link rel="apple-touch-icon" href="/branding/regional-ai-icon-192.png" />
    <meta
      name="description"
      content="거창 가조의 계획·현장 안내·길찾기를 잇는 지역 AI 여행안내"
    />
    <title>가조 AI 여행안내</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
