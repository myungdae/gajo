map $host $spa_entry {
    hostnames;
    default /unsupported.html;
    exkovia.com /exkovia.html;
    www.exkovia.com /exkovia.html;
    gajo.odex.kr /index.html;
    okcheon.odex.kr /index.html;
    muan.odex.kr /index.html;
    gyeryong.odex.kr /index.html;
    hapcheon.odex.kr /index.html;
    daejeon-junggu.odex.kr /index.html;
    copilot.odex.kr /copilot.html;
    guide.odex.kr /guide.html;
    localhost /index.html;
    127.0.0.1 /index.html;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /index.html {
        if ($spa_entry != /index.html) { return 404; }
        add_header Cache-Control "no-cache";
    }
    location = /copilot.html {
        internal;
        add_header Cache-Control "no-cache";
    }
    location = /guide.html {
        internal;
        add_header Cache-Control "no-cache";
    }
    location = /exkovia.html {
        internal;
        add_header Cache-Control "no-cache";
    }
    location = /unsupported.html {
        internal;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location ~ ^/manifest-[a-z-]+\.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }
    location ^~ /branding/ {
        try_files $uri =404;
    }
    location = /favicon.svg {
        try_files $uri =404;
    }

    location = / {
        rewrite ^ $spa_entry last;
    }

    location = /regional-report {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $spa_entry;
    }

    location / {
        try_files $uri $uri/ $spa_entry;
    }

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
