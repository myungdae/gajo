version: "3.8"

services:
  mongo:
    image: mongo:7.0
    container_name: gajo-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - gajo-net

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gajo-api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      - mongo
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/gajo
      # 카카오 디벨로퍼스(developers.kakao.com)에서 발급받은 REST API 키.
      # "내 주변 실제 식당 찾기" 기능(/api/nearby/*)이 이 키로 카카오 로컬
      # API를 호출합니다. 무료 티어(일 100,000건)로 충분히 운영 가능하며,
      # 키가 없으면 해당 기능만 비활성화되고 나머지 서비스는 정상 동작합니다.
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY:-}
      - KAKAO_LOCAL_TIMEOUT_MS=${KAKAO_LOCAL_TIMEOUT_MS:-5000}
      - CLOSING_SOON_MINUTES=${CLOSING_SOON_MINUTES:-60}
      - GAJO_LATITUDE=${GAJO_LATITUDE:-35.7423}
      - GAJO_LONGITUDE=${GAJO_LONGITUDE:-127.9528}
      - GAJO_TIMEZONE=${GAJO_TIMEZONE:-Asia/Seoul}
      - OPEN_METEO_TIMEOUT_MS=${OPEN_METEO_TIMEOUT_MS:-3500}
      - CONTEXT_EXTRACTOR_PROVIDER=${CONTEXT_EXTRACTOR_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_CONTEXT_MODEL=${OPENAI_CONTEXT_MODEL:-}
      - OPENAI_CONTEXT_TIMEOUT_MS=${OPENAI_CONTEXT_TIMEOUT_MS:-8000}
      - MAX_CONTEXT_LLM_CALLS_PER_SESSION=${MAX_CONTEXT_LLM_CALLS_PER_SESSION:-3}
      # Regional Copilot manager authentication. Supply both from a secret store.
      - ADMIN_WRITE_TOKEN=${ADMIN_WRITE_TOKEN}
      - EXKO_HAPCHEON_PILOT=${EXKO_HAPCHEON_PILOT:-false}
      - COPILOT_JWT_SECRET=${COPILOT_JWT_SECRET:-}
      - COPILOT_USERS_JSON=${COPILOT_USERS_JSON:-[]}
      # QR 생성 시점에만 사용하는 공개 Origin. DB에는 hostname을 저장하지 않습니다.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - OPENAI_CONTEXT_INPUT_USD_PER_MILLION_TOKENS=${OPENAI_CONTEXT_INPUT_USD_PER_MILLION_TOKENS:-}
      - OPENAI_CONTEXT_OUTPUT_USD_PER_MILLION_TOKENS=${OPENAI_CONTEXT_OUTPUT_USD_PER_MILLION_TOKENS:-}
    networks:
      - gajo-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gajo-client
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
    networks:
      - gajo-net

networks:
  gajo-net:
    driver: bridge

volumes:
  mongo_data:
